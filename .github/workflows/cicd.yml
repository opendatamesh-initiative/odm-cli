name: odm-cli CI/CD

on:
  release:
    types: [ created ]

jobs:
  verify-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Get Git Tag
        run: |
          TAG_VERSION=$(echo "${{ github.ref_name }}" | sed 's/[^0-9.]//g')
          echo "TAG_VERSION=${TAG_VERSION}" >> $GITHUB_ENV
      - name: Get Maven Version
        run: |
          MAVEN_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "MAVEN_VERSION=${MAVEN_VERSION}" >> $GITHUB_ENV
      - name: Check Tag and Version Match
        run: |
          if [ "${{ env.TAG_VERSION }}" != "${{ env.MAVEN_VERSION }}" ]; then
            echo "Git tag (${{ env.TAG_VERSION }}) does not match POM version (${{ env.MAVEN_VERSION }})"
            exit 1
          fi
      - name: Set up Maven settings
        run: |
          mkdir -p ~/.m2
          echo "<settings>
            <servers>
              <server>
                <id>odm-spec-parser-repo</id>
                <username>your-github-username</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
              <server>
                <id>odm-cli-extensions-repo</id>
                <username>your-github-username</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>" > ~/.m2/settings.xml
      - name: Execute tests with Maven
        run: mvn -B test

  build-and-release-jar:
    runs-on: ubuntu-latest
    needs: verify-version
    permissions:
      contents: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Set up Maven settings
        run: |
          mkdir -p ~/.m2
          echo "<settings>
            <servers>
              <server>
                <id>odm-spec-parser-repo</id>
                <username>your-github-username</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
              <server>
                <id>odm-cli-extensions-repo</id>
                <username>your-github-username</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>" > ~/.m2/settings.xml
      - name: Build jar
        run: mvn clean package -DskipTests
      - name: Get JAR Version
        run: |
          JAR_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "JAR_VERSION=${JAR_VERSION}" >> $GITHUB_ENV
      - name: Inject Version into odm-cli script
        run: |
          sed -i "s/VERSION=\"latest\"/VERSION=\"${{ env.JAR_VERSION }}\"/"  odm-cli
      - name: Upload JAR to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/odm-cli-${{ env.JAR_VERSION }}.jar
            odm-cli
      - name: Keep the JAR for the image job
        uses: actions/upload-artifact@v7
        with:
          name: odm-cli-jar
          path: target/odm-cli-${{ env.JAR_VERSION }}.jar
          if-no-files-found: error

  publish-image:
    runs-on: ubuntu-latest
    needs: build-and-release-jar
    permissions:
      contents: read
    env:
      IMAGE_NAME: opendatamesh/odm-cli
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Download the released JAR
        uses: actions/download-artifact@v8
        with:
          name: odm-cli-jar
          path: target
      - name: Get Release Version
        run: |
          IMAGE_VERSION=$(echo "${{ github.ref_name }}" | sed 's/[^0-9.]//g')
          echo "IMAGE_VERSION=${IMAGE_VERSION}" >> $GITHUB_ENV
      - name: Build Docker image
        run: >
          docker build . --file Dockerfile
          --build-arg VERSION=${{ env.IMAGE_VERSION }} --build-arg REVISION=${{ github.sha }}
          --tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
      - name: DockerHub login
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PWD: ${{ secrets.DOCKER_PASSWORD }}
        run: echo "$DOCKER_PWD" | docker login -u "$DOCKER_USER" --password-stdin
      - name: DockerHub image push
        run: docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
